name: 'parkland_health'  # Or whatever your project name is
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# FORCE WORKSPACE CATALOG FOR ALL MODELS
models:
  parkland_health:  # Replace with your actual project name
    +database: workspace  # This forces workspace catalog
    silver:
      +schema: silver
      +materialized: table
    gold:
      +schema: gold
      +materialized: table

# FORCE WORKSPACE FOR SOURCES TOO
sources:
  +database: workspace